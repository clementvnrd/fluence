name: Windows

# The Windows app is written on a Mac and cannot be run here. CI is the only place it is
# ever compiled against a real Windows SDK, so this workflow is the primary correctness
# signal, not a formality — hence warnings-as-errors and the strictest analyzers available.

on:
  push:
    branches: [main]
    paths: ['windows/**', 'shared/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'shared/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build, analyze & test
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json

      - name: Environment
        shell: pwsh
        run: |
          dotnet --info
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      - name: Restore
        run: dotnet restore Murmur.sln

      # --no-incremental is REQUIRED, not tidiness: Roslyn analyzer warnings are not
      # re-emitted on an incremental build, so -warnaserror would pass on cached results
      # and the whole gate would be theatre.
      - name: Build (warnings are errors)
        run: >
          dotnet build Murmur.sln
          --no-restore
          --configuration Release
          --no-incremental
          -warnaserror
          -bl:artifacts/build.binlog

      - name: Test
        run: >
          dotnet test Murmur.sln
          --no-build
          --configuration Release
          --logger "trx;LogFileName=results.trx"
          --logger "console;verbosity=normal"
          --results-directory artifacts/test-results

      # The published exe is the only artifact CI can actually run, and a runner cannot
      # show a window — so --selftest exercises startup, native library resolution out of
      # the self-extracted bundle, and model discovery, then exits. That is the class of
      # failure that appears only after publishing.
      - name: Publish and smoke-test the real exe
        shell: pwsh
        run: |
          dotnet publish src/Murmur.App/Murmur.App.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            --output artifacts/publish
          $exe = 'artifacts/publish/Fluence.exe'
          if (-not (Test-Path $exe)) { throw "Published exe not found at $exe" }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "published: $size MB"
          # Start-Process -Wait, not '&': this is a WinExe, so the console does not block on
          # it and $LASTEXITCODE would be whatever ran before — the gate would never fail.
          $run = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow
          if ($run.ExitCode -ne 0) { throw "self-test failed with exit code $($run.ExitCode)" }

          # The exe alone is NOT the app: the platform layer and its dependencies ship as
          # loose DLLs beside it, because the exe loads them by reflection and single-file
          # publishing cannot bundle what it cannot see. An artifact without them starts
          # fine and then does nothing when the key is pressed.
          foreach ($dll in 'Murmur.Platform.Windows.dll', 'NAudio.Wasapi.dll',
                           'System.Security.Cryptography.ProtectedData.dll') {
            if (-not (Test-Path "artifacts/publish/$dll")) { throw "publish folder is missing $dll" }
          }
          Get-ChildItem artifacts/publish | Select-Object Name, @{n='KB';e={[math]::Round($_.Length/1KB)}}

      # The whole publish folder, which upload-artifact delivers as one zip. Never the exe
      # alone — see the check above.
      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: Fluence-win-x64
          path: windows/artifacts/publish/
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: windows/artifacts/test-results
          # 'warn', not 'error': when the build fails before tests run there are no results,
          # and a second red step there only obscures the real failure.
          if-no-files-found: warn

      # A binlog is the single most useful artifact when a failure can't be reproduced
      # locally — which, for this project, is every Windows failure.
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-binlog
          path: windows/artifacts/build.binlog
          if-no-files-found: ignore
