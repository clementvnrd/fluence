name: Windows

# The Windows app is written on a Mac and cannot be run here. CI is the only place it is
# ever compiled against a real Windows SDK, so this workflow is the primary correctness
# signal, not a formality — hence warnings-as-errors and the strictest analyzers available.

# The consent notice is checked word for word against the Swift source, so a wording change
# there runs this workflow too.
on:
  push:
    branches: [main]
    paths: ['windows/**', 'shared/**', '.github/workflows/windows.yml', 'Sources/FluenceNotesCore/ConsentNotice.swift']
  pull_request:
    paths: ['windows/**', 'shared/**', '.github/workflows/windows.yml', 'Sources/FluenceNotesCore/ConsentNotice.swift']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build, analyze & test
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json

      - name: Environment
        shell: pwsh
        run: |
          dotnet --info
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      - name: Restore
        run: dotnet restore Murmur.sln

      # --no-incremental is REQUIRED, not tidiness: Roslyn analyzer warnings are not
      # re-emitted on an incremental build, so -warnaserror would pass on cached results
      # and the whole gate would be theatre.
      - name: Build (warnings are errors)
        run: >
          dotnet build Murmur.sln
          --no-restore
          --configuration Release
          --no-incremental
          -warnaserror
          -bl:artifacts/build.binlog

      - name: Test
        run: >
          dotnet test Murmur.sln
          --no-build
          --configuration Release
          --logger "trx;LogFileName=results.trx"
          --logger "console;verbosity=normal"
          --results-directory artifacts/test-results

      # The published exe is the only artifact CI can actually run, and a runner cannot
      # show a window — so --selftest exercises startup, the reflection-loaded platform
      # layer and every dependency it pulls in (a WASAPI enumeration through NAudio, a DPAPI
      # round trip, a SystemEvents subscription), a real P/Invoke into the sherpa-onnx native
      # library extracted from the bundle, sealed-history round trips and model discovery,
      # then exits non-zero on any failure. That is the class of failure that appears only
      # after publishing.
      - name: Publish and smoke-test the real exe
        shell: pwsh
        run: |
          dotnet publish src/Murmur.App/Murmur.App.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            --output artifacts/publish
          $exe = 'artifacts/publish/Fluence.exe'
          if (-not (Test-Path $exe)) { throw "Published exe not found at $exe" }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "published: $size MB"
          # Start-Process -Wait, not '&': this is a WinExe, so the console does not block on
          # it and $LASTEXITCODE would be whatever ran before — the gate would never fail.
          $run = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow
          if ($run.ExitCode -ne 0) { throw "self-test failed with exit code $($run.ExitCode)" }

          # What actually ships, for the log. Whether the platform layer and its dependencies
          # end up loose beside the exe or inside the single-file bundle is the SDK's call;
          # the self-test above is the real gate — it loads the layer by reflection, enumerates
          # WASAPI through NAudio, round-trips DPAPI and subscribes to session events from
          # this very folder, exactly as a user's double-click would.
          #
          # One thing the self-test cannot see: Microsoft.Win32.SystemEvents ships a ~27 KB
          # PlatformNotSupported stub in lib/, the real implementation (~80 KB) is under
          # runtimes/win. If a loose copy is present, make sure it is the real one.
          $events = 'artifacts/publish/Microsoft.Win32.SystemEvents.dll'
          if ((Test-Path $events) -and (Get-Item $events).Length -lt 50KB) {
            throw 'publish folder has the SystemEvents stub, not the Windows implementation'
          }
          Get-ChildItem artifacts/publish | Select-Object Name, @{n='KB';e={[math]::Round($_.Length/1KB)}}

      # The whole publish folder, which upload-artifact delivers as one zip — never the exe
      # alone, in case the SDK leaves any dependency loose beside it.
      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: Fluence-win-x64
          path: windows/artifacts/publish/
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: windows/artifacts/test-results
          # 'warn', not 'error': when the build fails before tests run there are no results,
          # and a second red step there only obscures the real failure.
          if-no-files-found: warn

      # A binlog is the single most useful artifact when a failure can't be reproduced
      # locally — which, for this project, is every Windows failure.
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-binlog
          path: windows/artifacts/build.binlog
          if-no-files-found: ignore
