name: macOS

# Builds the whole app and runs every Swift test target, including the behaviour contracts
# (dictionary vectors, meeting vectors).
#
# Pull requests and manual runs only: on a private repository a macOS minute costs ten
# included minutes, and a merge to main has already passed this on its pull request.

on:
  pull_request:
    paths: ['Sources/**', 'Tests/**', 'shared/**', 'Resources/**', 'Package.swift', 'Package.resolved', '.github/workflows/macos.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build app & test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The app needs the macOS 26 SDK (SpeechAnalyzer, Foundation Models, process taps),
      # which ships with Xcode 26. Select the newest Xcode present rather than pinning a
      # version that will age out of the image.
      - name: Select the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          swift --version
          xcrun --show-sdk-version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}

      # The whole app, not just the libraries: CI is the only place the SwiftUI views are
      # compiled when a contributor's Mac has only the Command Line Tools.
      - name: Build the app
        run: swift build --product Fluence

      - name: Test
        run: swift test

      - name: Confirm the shared vectors and their test copies are identical
        run: |
          status=0
          for pair in \
            "shared/dictionary-test-vectors.json Tests/FluenceDictionaryTests/dictionary-test-vectors.json" \
            "shared/meeting-test-vectors.json Tests/FluenceMeetingCoreTests/meeting-test-vectors.json" \
            "shared/transcript-import-vectors.json Tests/FluenceMeetingCoreTests/transcript-import-vectors.json" \
            "shared/speaker-consolidation-vectors.json Tests/FluenceMeetingCoreTests/speaker-consolidation-vectors.json"; do
            set -- $pair
            [ -f "$1" ] || continue
            if ! diff -q "$1" "$2"; then
              echo "::error::$2 has drifted from $1. Run: cp $1 $2"
              status=1
            fi
          done
          exit $status
